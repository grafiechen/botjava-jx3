<!DOCTYPE html>
<html lang="zh-cn">
<head>
    <meta charset="UTF-8">
    <meta content="width=device-width, initial-scale=1.0" name="viewport">
    <title>小药推荐</title>
    <style>
        * { box-sizing: border-box; }
        [v-cloak] { display: none; }
        body { margin: 0; min-width: 1080px; background: #edf1f2; color: #20272c; font-family: "Microsoft YaHei", "PingFang SC", sans-serif; letter-spacing: 0; }
        #main { min-height: 720px; padding: 38px 54px; }
        .board { width: 100%; max-width: 1172px; margin: 0 auto; overflow: hidden; background: #fff; border: 1px solid #cfd5d8; border-radius: 8px; box-shadow: 0 18px 42px rgba(31, 38, 43, .12); }
        .header { min-height: 138px; padding: 25px 34px; display: flex; align-items: flex-end; justify-content: space-between; gap: 28px; border-top: 8px solid #596b48; border-bottom: 1px solid #dce1e4; }
        .eyebrow { margin: 0 0 8px; color: #68747c; font-size: 17px; }
        h1 { margin: 0; font-size: 38px; line-height: 1.2; }
        .count { color: #596b48; font-size: 18px; font-weight: 800; }
        .table-head, .row { display: grid; grid-template-columns: 58px .85fr 1fr 1.25fr 1.4fr .7fr .75fr; gap: 14px; align-items: center; }
        .table-head { min-height: 52px; padding: 0 28px; color: #68747c; background: #f4f6f7; border-bottom: 1px solid #dce1e4; font-size: 13px; font-weight: 700; }
        .row { min-height: 78px; padding: 12px 28px; border-bottom: 1px solid #e2e6e8; }
        .row:last-child { border-bottom: 0; }
        .index { color: #945847; font-size: 22px; font-weight: 800; }
        .school { color: #35636b; font-size: 15px; font-weight: 750; overflow-wrap: anywhere; }
        .kungfu { color: #20272c; font-size: 16px; font-weight: 800; overflow-wrap: anywhere; }
        .category { color: #606c72; font-size: 14px; overflow-wrap: anywhere; }
        .name { color: #6f554c; font-size: 15px; font-weight: 750; overflow-wrap: anywhere; }
        .tag { justify-self: start; padding: 6px 9px; color: #355f66; background: #e8eff0; border-radius: 4px; font-size: 13px; font-weight: 750; }
        .empty { min-height: 320px; display: flex; align-items: center; justify-content: center; color: #77838a; font-size: 22px; }
        .footer { padding: 17px 28px 20px; color: #7a858c; background: #fafbfb; border-top: 1px solid #dce1e4; font-size: 13px; }
    </style>
</head>
<body>
<main id="main" v-cloak>
    <article class="board">
        <header class="header"><div><p class="eyebrow">剑网 3 心法增益参考</p><h1>小药推荐</h1></div><div class="count">{{ data && data.length ? data.length : 0 }} 项</div></header>
        <template v-if="data && data.length">
            <div class="table-head"><span>序号</span><span>门派</span><span>心法</span><span>类别</span><span>名称</span><span>增益</span><span>颜色</span></div>
            <section><div class="row" v-for="(item, index) in data" :key="index"><span class="index">{{ index + 1 }}</span><span class="school">{{ item.school || '门派未知' }}</span><span class="kungfu">{{ item.kungfu || '心法未知' }}</span><span class="category">{{ item.category || '类别未知' }}</span><span class="name">{{ item.name || '名称未知' }}</span><span class="tag">{{ item.boost || '未知' }}</span><span class="tag">{{ item.color || '未知' }}</span></div></section>
        </template>
        <div class="empty" v-else>暂无小药推荐数据</div>
        <footer class="footer">推荐结果以当前接口数据为准</footer>
    </article>
</main>
</body>
</html>
