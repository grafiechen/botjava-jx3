<!DOCTYPE html>
<html lang="zh-cn">
<head>
    <meta charset="UTF-8">
    <meta content="width=device-width, initial-scale=1.0" name="viewport">
    <title>物品价格</title>
    <style>
        * { box-sizing: border-box; }
        [v-cloak] { display: none; }
        body {
            margin: 0;
            min-width: 1080px;
            background: #eef1f2;
            color: #22282d;
            font-family: "Microsoft YaHei", "PingFang SC", sans-serif;
            letter-spacing: 0;
        }
        #main { min-height: 720px; padding: 46px 60px; }
        .board {
            width: 100%;
            max-width: 1160px;
            margin: 0 auto;
            overflow: hidden;
            background: #ffffff;
            border: 1px solid #cfd5d8;
            border-radius: 8px;
            box-shadow: 0 18px 42px rgba(31, 38, 43, 0.12);
        }
        .header {
            padding: 28px 36px 24px;
            border-top: 8px solid #297067;
            border-bottom: 1px solid #dce1e4;
        }
        .eyebrow { margin: 0 0 8px; color: #68747c; font-size: 17px; }
        h1 { margin: 0; color: #20262b; font-size: 36px; line-height: 1.25; overflow-wrap: anywhere; }
        .meta { display: flex; flex-wrap: wrap; gap: 9px; margin-top: 16px; }
        .tag {
            padding: 6px 11px;
            color: #394249;
            background: #edf2f1;
            border: 1px solid #d4dedb;
            border-radius: 4px;
            font-size: 14px;
            font-weight: 700;
        }
        .tag.price { color: #9a561f; background: #fff3e5; border-color: #ecd5b7; }
        .description {
            margin: 16px 0 0;
            max-width: 1040px;
            color: #5e6971;
            font-size: 15px;
            line-height: 1.65;
            overflow-wrap: anywhere;
        }
        .chart-section { padding: 24px 36px 12px; border-bottom: 1px solid #dce1e4; }
        .section-title { margin: 0 0 12px; color: #293137; font-size: 20px; }
        .chart { width: 100%; height: 330px; display: block; background: #fafcfc; border: 1px solid #e0e6e8; }
        .axis { stroke: #aeb9be; stroke-width: 1; }
        .grid { stroke: #e2e8ea; stroke-width: 1; }
        .line { fill: none; stroke: #28786c; stroke-width: 4; stroke-linecap: round; stroke-linejoin: round; }
        .point { fill: #b76824; stroke: #ffffff; stroke-width: 2; }
        .chart-label { fill: #69757c; font-size: 13px; }
        .point-label { fill: #9a561f; font-size: 13px; font-weight: 700; }
        .chart-empty {
            height: 180px;
            display: flex;
            align-items: center;
            justify-content: center;
            color: #7a858c;
            background: #fafcfc;
            border: 1px solid #e0e6e8;
            font-size: 18px;
        }
        .records { padding: 22px 36px 8px; }
        .table-head,
        .row {
            display: grid;
            grid-template-columns: 150px minmax(210px, 1.2fr) minmax(150px, .8fr) 150px 120px;
            gap: 18px;
            align-items: center;
        }
        .table-head {
            min-height: 48px;
            padding: 0 18px;
            color: #68747c;
            background: #f4f6f7;
            border: 1px solid #dce1e4;
            font-size: 13px;
            font-weight: 700;
        }
        .row { min-height: 62px; padding: 10px 18px; border: 1px solid #e3e7e9; border-top: 0; }
        .date { color: #5d6870; font-size: 15px; }
        .server { color: #273037; font-size: 16px; font-weight: 700; overflow-wrap: anywhere; }
        .zone { color: #68747c; font-size: 15px; overflow-wrap: anywhere; }
        .record-price { color: #9a561f; font-size: 18px; font-weight: 800; }
        .sale { color: #28786c; font-size: 15px; font-weight: 700; }
        .records-empty { padding: 70px 0; color: #7a858c; text-align: center; font-size: 19px; }
        .footer {
            padding: 18px 36px 21px;
            display: flex;
            justify-content: space-between;
            gap: 20px;
            color: #7a858c;
            background: #fafbfb;
            border-top: 1px solid #dce1e4;
            font-size: 14px;
        }
    </style>
</head>
<body>
    <main id="main" v-cloak>
        <article class="board">
            <header class="header">
                <p class="eyebrow">{{ mode || '物品价格' }} · {{ server || '全区服' }}</p>
                <h1>{{ itemTitle }}</h1>
                <div class="meta">
                    <span class="tag" v-if="item.classType || item['class']">分类：{{ item.classType || item['class'] }}</span>
                    <span class="tag" v-if="item.subclass">子类：{{ item.subclass }}</span>
                    <span class="tag" v-if="item.level != null">等级：{{ item.level }}</span>
                    <span class="tag price" v-if="item.value">官方售价：{{ item.value }}</span>
                    <span class="tag" v-if="item.date">上架日期：{{ item.date }}</span>
                </div>
                <p class="description">{{ item.desc || '暂无物品描述' }}</p>
            </header>

            <section class="chart-section">
                <h2 class="section-title">近期价格走势</h2>
                <svg class="chart" viewBox="0 0 1080 330" v-if="trendRecords.length >= 2">
                    <line x1="84" y1="260" x2="1030" y2="260" class="axis"></line>
                    <line x1="84" y1="52" x2="84" y2="260" class="axis"></line>
                    <g v-for="gridLine in chartGridLines">
                        <line x1="84" :y1="gridLine.y" x2="1030" :y2="gridLine.y" class="grid"></line>
                        <text x="18" :y="gridLine.y + 5" class="chart-label">{{ gridLine.value }}</text>
                    </g>
                    <polyline :points="chartLinePoints" class="line"></polyline>
                    <g v-for="point in chartPoints">
                        <circle :cx="point.x" :cy="point.y" r="6" class="point"></circle>
                        <text :x="point.x" :y="point.y - 13" text-anchor="middle" class="point-label">{{ point.value }}</text>
                        <text :x="point.x" y="292" text-anchor="middle" class="chart-label">{{ point.label }}</text>
                    </g>
                </svg>
                <div class="chart-empty" v-else>价格记录不足，暂不生成趋势线</div>
            </section>

            <section class="records">
                <h2 class="section-title">近期价格记录</h2>
                <template v-if="recentRecords.length">
                    <div class="table-head">
                        <span>日期</span>
                        <span>服务器</span>
                        <span>大区</span>
                        <span>价格</span>
                        <span>类型</span>
                    </div>
                    <div class="row" v-for="(record, index) in recentRecords" :key="index">
                        <span class="date">{{ record.date || record.datetime || '日期未知' }}</span>
                        <strong class="server">{{ record.server || '未知服务器' }}</strong>
                        <span class="zone">{{ record.zone || '未知大区' }}</span>
                        <span class="record-price">{{ formatPrice(record.value) }}</span>
                        <span class="sale">{{ saleText(record.sales == null ? record.sale : record.sales) }}</span>
                    </div>
                </template>
                <div class="records-empty" v-else>暂无价格记录</div>
            </section>

            <footer class="footer">
                <span>趋势图最多展示最近 8 条有效记录</span>
                <span>数据来源：www.jx3api.com</span>
            </footer>
        </article>
    </main>

    <script>
        (function () {
            var raw = window.__BOT_DATA__ || {};
            var item = raw.data && typeof raw.data === 'object' && !Array.isArray(raw.data)
                ? raw.data : {};

            function asArray(value) {
                return Array.isArray(value) ? value : [];
            }

            function flatten(groups) {
                return asArray(groups).reduce(function (result, group) {
                    return result.concat(asArray(group));
                }, []);
            }

            function dateValue(record) {
                var text = record.datetime || record.date || '';
                var parsed = Date.parse(String(text).replace(/\//g, '-'));
                return Number.isNaN(parsed) ? 0 : parsed;
            }

            new Vue({
                el: '#main',
                data: function () {
                    return {
                        mode: raw.mode || '物品价格',
                        server: raw.server || '',
                        queryName: raw.name || '',
                        item: item,
                        saleCodeMapping: {
                            1: '出售', 2: '收购', 3: '想出', 4: '想收',
                            5: '成交', 6: '正出', 7: '公示'
                        }
                    };
                },
                computed: {
                    itemTitle: function () {
                        var title = this.item.name || this.queryName || '物品价格';
                        return this.item.alias ? title + '（' + this.item.alias + '）' : title;
                    },
                    allRecords: function () {
                        return flatten(this.item.data || this.item.list)
                            .filter(function (record) { return record && record.value != null; });
                    },
                    trendRecords: function () {
                        return this.allRecords.slice().sort(function (left, right) {
                            return dateValue(left) - dateValue(right);
                        }).slice(-8);
                    },
                    recentRecords: function () {
                        return this.allRecords.slice().sort(function (left, right) {
                            return dateValue(right) - dateValue(left);
                        }).slice(0, 6);
                    },
                    chartBounds: function () {
                        var values = this.trendRecords.map(function (record) { return Number(record.value); });
                        var min = Math.min.apply(null, values);
                        var max = Math.max.apply(null, values);
                        if (!Number.isFinite(min) || !Number.isFinite(max)) {
                            return {min: 0, max: 1};
                        }
                        if (min === max) {
                            return {min: Math.max(0, min - 1), max: max + 1};
                        }
                        return {min: min, max: max};
                    },
                    chartPoints: function () {
                        var self = this;
                        var records = this.trendRecords;
                        var bounds = this.chartBounds;
                        var width = 946;
                        var height = 208;
                        return records.map(function (record, index) {
                            var ratio = (Number(record.value) - bounds.min) / (bounds.max - bounds.min);
                            return {
                                x: Math.round(84 + width * index / (records.length - 1)),
                                y: Math.round(52 + height - ratio * height),
                                value: self.formatPrice(record.value),
                                label: self.shortDate(record.date || record.datetime)
                            };
                        });
                    },
                    chartLinePoints: function () {
                        return this.chartPoints.map(function (point) {
                            return point.x + ',' + point.y;
                        }).join(' ');
                    },
                    chartGridLines: function () {
                        var bounds = this.chartBounds;
                        var self = this;
                        return [0, 1, 2, 3].map(function (index) {
                            var ratio = index / 3;
                            return {
                                y: Math.round(260 - ratio * 208),
                                value: self.formatPrice(bounds.min + (bounds.max - bounds.min) * ratio)
                            };
                        });
                    }
                },
                methods: {
                    formatPrice: function (value) {
                        return value == null ? '暂无' : Math.round(Number(value)).toLocaleString('zh-CN');
                    },
                    shortDate: function (value) {
                        var text = String(value || '');
                        return text.length >= 10 ? text.substring(5, 10) : text || '-';
                    },
                    saleText: function (code) {
                        return this.saleCodeMapping[code] || '记录';
                    }
                },
                mounted: function () {
                    this.$nextTick(function () { window.__BOT_RENDERED__ = true; });
                }
            });
        })();
    </script>
</body>
</html>
