<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>背包预警</title>
    <style>
        * { box-sizing: border-box; }
        [v-cloak] { display: none; }
        html, body { margin: 0; }
        body { background: #eef2f3; color: #20282d; font-family: "Noto Sans CJK SC", "Microsoft YaHei", sans-serif; letter-spacing: 0; }
        #main { display: inline-block; padding: 12px; }
        .sheet { overflow: hidden; background: #fff; border: 1px solid #cbd4d7; border-top: 5px solid #326f68; border-radius: 6px; box-shadow: 0 7px 18px rgba(31, 42, 48, .10); }
        .header { min-height: 58px; padding: 12px 16px 11px; border-bottom: 1px solid #d9e0e2; display: flex; align-items: end; justify-content: space-between; gap: 20px; }
        .eyebrow { margin: 0 0 2px; color: #78868c; font-size: 10px; }
        h1 { margin: 0; font-size: 20px; line-height: 1.3; }
        .summary { color: #765143; font-size: 11px; white-space: nowrap; }
        .grid { display: grid; grid-template-columns: repeat(5, 164px); }
        .card { min-width: 0; border-right: 1px solid #dce3e5; border-bottom: 1px solid #dce3e5; }
        .card:nth-child(5n) { border-right: 0; }
        .name { min-height: 43px; margin: 0; padding: 9px 8px; display: flex; align-items: center; justify-content: center; color: #326f68; background: #f4f7f7; border-bottom: 1px solid #dce3e5; font-size: 12px; line-height: 1.35; text-align: center; overflow-wrap: anywhere; }
        .remaining { min-height: 66px; padding: 8px; display: flex; flex-direction: column; align-items: center; justify-content: center; }
        .label { color: #7b888e; font-size: 10px; }
        .value { margin-top: 2px; color: #a34838; font-size: 24px; line-height: 1.2; font-weight: 700; }
        .footer { min-height: 30px; padding: 7px 12px; display: flex; align-items: center; justify-content: space-between; gap: 16px; color: #7a878d; background: #fafbfb; font-size: 9px; }
    </style>
</head>
<body>
<main id="main" v-cloak>
    <article class="sheet" data-capture-root
             :style="{ width: (Math.min(Math.max(count || 1, 1), 5) * 164) + 'px' }">
        <header class="header">
            <div><p class="eyebrow">小猫饼 · 角色状态</p><h1>背包预警</h1></div>
            <div class="summary">剩余空间 &lt; {{ threshold }} · {{ count }} 个角色</div>
        </header>
        <section class="grid" :style="{ gridTemplateColumns: 'repeat(' + Math.min(Math.max(count || 1, 1), 5) + ', 164px)' }">
            <article class="card" v-for="record in records" :key="record.index">
                <h2 class="name">{{ record.roleName }} - {{ record.server }}</h2>
                <div class="remaining"><span class="label">剩余背包空间</span><strong class="value">{{ record.remainingSpace }}</strong></div>
            </article>
        </section>
        <footer class="footer"><span>数据来自角色状态数据库</span><span>仅显示少于 {{ threshold }} 的记录</span></footer>
    </article>
</main>
</body>
</html>
