<!DOCTYPE html>
<html lang="zh-cn">
<head>
    <meta charset="UTF-8">
    <meta content="width=device-width, initial-scale=1.0" name="viewport">
    <title>赤兔记录</title>
    <style>
        * { box-sizing: border-box; }
        [v-cloak] { display: none; }
        body {
            margin: 0;
            min-width: 1080px;
            background: #edf1f2;
            color: #20272c;
            font-family: "Microsoft YaHei", "PingFang SC", sans-serif;
            letter-spacing: 0;
        }
        #main { min-height: 720px; padding: 46px 60px; }
        .board {
            width: 100%;
            max-width: 1160px;
            margin: 0 auto;
            overflow: hidden;
            background: #ffffff;
            border: 1px solid #cfd5d8;
            border-radius: 8px;
            box-shadow: 0 18px 42px rgba(31, 38, 43, 0.12);
        }
        .header {
            min-height: 148px;
            padding: 28px 36px;
            display: flex;
            align-items: flex-end;
            justify-content: space-between;
            gap: 28px;
            border-top: 8px solid #7a4b43;
            border-bottom: 1px solid #dce1e4;
        }
        .eyebrow { margin: 0 0 8px; color: #68747c; font-size: 17px; }
        h1 { margin: 0; color: #20262b; font-size: 38px; line-height: 1.2; }
        .scope {
            padding: 9px 15px;
            color: #ffffff;
            background: #426b70;
            border-radius: 4px;
            font-size: 18px;
            font-weight: 750;
        }
        .table-head, .row {
            display: grid;
            grid-template-columns: 70px 1.15fr 1.25fr 1fr 150px;
            column-gap: 24px;
            align-items: center;
        }
        .table-head {
            min-height: 54px;
            padding: 0 36px;
            color: #65727a;
            background: #f4f6f7;
            border-bottom: 1px solid #dce1e4;
            font-size: 14px;
            font-weight: 700;
        }
        .row {
            min-height: 82px;
            padding: 13px 36px;
            border-bottom: 1px solid #e0e4e6;
        }
        .row:last-child { border-bottom: 0; }
        .index { color: #945649; font-size: 25px; font-weight: 800; }
        .primary { color: #20272c; font-size: 18px; font-weight: 750; overflow-wrap: anywhere; }
        .map { color: #35656b; font-size: 17px; font-weight: 750; overflow-wrap: anywhere; }
        .horse {
            justify-self: start;
            padding: 7px 11px;
            color: #8a4d41;
            background: #f5e9e5;
            border-radius: 4px;
            font-size: 16px;
            font-weight: 750;
        }
        .date { color: #65727a; font-size: 16px; font-weight: 650; }
        .empty {
            min-height: 300px;
            display: flex;
            align-items: center;
            justify-content: center;
            color: #77838a;
            font-size: 22px;
        }
        .footer {
            padding: 19px 36px 21px;
            color: #7a858c;
            background: #fafbfb;
            border-top: 1px solid #dce1e4;
            font-size: 14px;
        }
    </style>
</head>
<body>
    <main id="main" v-cloak>
        <article class="board">
            <header class="header">
                <div>
                    <p class="eyebrow">剑网 3 马驹刷新记录</p>
                    <h1>{{ mode || '本日' }}赤兔</h1>
                </div>
                <div class="scope">{{ server || '全服' }}</div>
            </header>
            <template v-if="data && data.length">
                <div class="table-head">
                    <span>序号</span>
                    <span>服务器</span>
                    <span>地图</span>
                    <span>马匹</span>
                    <span>日期</span>
                </div>
                <section>
                    <div class="row" v-for="(item, index) in data" :key="index">
                        <span class="index">{{ index + 1 }}</span>
                        <span class="primary">{{ item.server || '服务器未知' }}</span>
                        <span class="map">{{ item.mapName || '地图未知' }}</span>
                        <span class="horse">{{ item.horse || '赤兔' }}</span>
                        <span class="date">{{ item.date || '日期未知' }}</span>
                    </div>
                </section>
            </template>
            <div class="empty" v-else>暂无{{ mode || '本日' }}赤兔记录</div>
            <footer class="footer">共 {{ data && data.length ? data.length : 0 }} 条记录</footer>
        </article>
    </main>
</body>
</html>
