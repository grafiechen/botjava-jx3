<!DOCTYPE html>
<html lang="zh-cn">
<head>
    <meta charset="UTF-8">
    <meta content="width=device-width, initial-scale=1.0" name="viewport">
    <title>未做奇遇</title>
    <style>
        * { box-sizing: border-box; }
        [v-cloak] { display: none; }
        body {
            margin: 0;
            min-width: 1080px;
            background: #edf1f2;
            color: #20272c;
            font-family: "Microsoft YaHei", "PingFang SC", sans-serif;
            letter-spacing: 0;
        }
        #main { min-height: 720px; padding: 40px 60px; }
        .board {
            width: 100%;
            max-width: 1160px;
            margin: 0 auto;
            overflow: hidden;
            background: #ffffff;
            border: 1px solid #cfd5d8;
            border-radius: 8px;
            box-shadow: 0 18px 42px rgba(31, 38, 43, 0.12);
        }
        .header {
            min-height: 145px;
            padding: 26px 36px;
            display: flex;
            align-items: flex-end;
            justify-content: space-between;
            gap: 28px;
            border-top: 8px solid #8d4d65;
            border-bottom: 1px solid #dce1e4;
        }
        .eyebrow { margin: 0 0 8px; color: #68747c; font-size: 17px; }
        h1 { margin: 0; color: #20262b; font-size: 38px; line-height: 1.2; }
        .identity { text-align: right; }
        .role { color: #8d4d65; font-size: 22px; font-weight: 800; overflow-wrap: anywhere; }
        .server { margin-top: 6px; color: #275e65; font-size: 15px; font-weight: 700; }
        .content { padding: 26px 32px 28px; }
        .events { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 11px; }
        .event {
            min-height: 105px;
            padding: 15px 16px;
            border: 1px solid #d9dfe1;
            border-top: 4px solid #7f9ca0;
            background: #fbfcfc;
        }
        .event-name { color: #263036; font-size: 18px; font-weight: 800; overflow-wrap: anywhere; }
        .type { margin-top: 9px; color: #7b4f61; font-size: 14px; font-weight: 700; overflow-wrap: anywhere; }
        .level { margin-top: 7px; color: #748087; font-size: 12px; }
        .empty {
            min-height: 330px;
            display: flex;
            align-items: center;
            justify-content: center;
            color: #77838a;
            font-size: 22px;
        }
        .footer {
            padding: 16px 32px 19px;
            color: #7a858c;
            background: #fafbfb;
            border-top: 1px solid #dce1e4;
            font-size: 13px;
        }
    </style>
</head>
<body>
    <main id="main" v-cloak>
        <article class="board">
            <header class="header">
                <div>
                    <p class="eyebrow">剑网 3 江湖际遇</p>
                    <h1>尚未触发的奇遇</h1>
                </div>
                <div class="identity">
                    <div class="role">{{ name || '角色未知' }}</div>
                    <div class="server">{{ server || '服务器未知' }}</div>
                </div>
            </header>
            <section class="content" v-if="data && data.length">
                <div class="events">
                    <article class="event" v-for="(item, index) in data" :key="index">
                        <div class="event-name">{{ item.name || '奇遇名称未知' }}</div>
                        <div class="type">{{ item.type || '类型未知' }}</div>
                        <div class="level">等级 {{ item.level ?? '-' }}</div>
                    </article>
                </div>
            </section>
            <div class="empty" v-else>暂无未做奇遇数据</div>
            <footer class="footer">共 {{ data && data.length ? data.length : 0 }} 个尚未触发的奇遇</footer>
        </article>
    </main>
</body>
</html>
