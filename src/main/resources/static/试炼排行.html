<!DOCTYPE html>
<html lang="zh-cn">
<head>
    <meta charset="UTF-8">
    <meta content="width=device-width, initial-scale=1.0" name="viewport">
    <title>试炼排行</title>
    <style>
        * { box-sizing: border-box; }
        [v-cloak] { display: none; }
        body {
            margin: 0;
            min-width: 1080px;
            background: #edf1f2;
            color: #22282d;
            font-family: "Microsoft YaHei", "PingFang SC", sans-serif;
            letter-spacing: 0;
        }
        #main { min-height: 720px; padding: 46px 60px; }
        .board {
            width: 100%;
            max-width: 1160px;
            margin: 0 auto;
            overflow: hidden;
            background: #ffffff;
            border: 1px solid #cdd4d8;
            border-radius: 8px;
            box-shadow: 0 18px 42px rgba(29, 37, 42, 0.12);
        }
        .header {
            min-height: 150px;
            padding: 28px 36px;
            display: flex;
            align-items: flex-end;
            justify-content: space-between;
            gap: 28px;
            border-top: 8px solid #396a78;
            border-bottom: 1px solid #d9e0e3;
        }
        .eyebrow { margin: 0 0 8px; color: #68757c; font-size: 17px; }
        h1 { margin: 0; color: #19242a; font-size: 38px; line-height: 1.2; }
        .filters { display: flex; gap: 10px; flex-wrap: wrap; justify-content: flex-end; }
        .filter {
            padding: 9px 15px;
            color: #ffffff;
            background: #237663;
            border-radius: 4px;
            font-size: 18px;
            font-weight: 700;
            overflow-wrap: anywhere;
        }
        .filter.kungfu { background: #9a5146; }
        .table-head,
        .row {
            display: grid;
            grid-template-columns: 76px minmax(250px, 1.4fr) 160px 190px 190px;
            gap: 18px;
            align-items: center;
        }
        .table-head {
            min-height: 54px;
            padding: 0 36px;
            color: #68757c;
            background: #f3f6f7;
            border-bottom: 1px solid #d9e0e3;
            font-size: 14px;
            font-weight: 700;
        }
        .row { min-height: 78px; padding: 13px 36px; border-bottom: 1px solid #e2e7e9; }
        .row:last-child { border-bottom: 0; }
        .rank { color: #9a5146; font-size: 24px; font-weight: 800; }
        .role { color: #20272c; font-size: 19px; font-weight: 750; overflow-wrap: anywhere; }
        .level { color: #237663; font-size: 20px; font-weight: 800; }
        .number { color: #384249; font-size: 18px; font-weight: 700; }
        .score { color: #b36a1e; font-size: 20px; font-weight: 800; }
        .empty {
            min-height: 300px;
            display: flex;
            align-items: center;
            justify-content: center;
            color: #77838a;
            font-size: 22px;
        }
        .footer {
            padding: 19px 36px 21px;
            display: flex;
            justify-content: space-between;
            gap: 20px;
            color: #7a858c;
            background: #fafbfb;
            border-top: 1px solid #d9e0e3;
            font-size: 14px;
        }
    </style>
</head>
<body>
    <main id="main" v-cloak>
        <article class="board">
            <header class="header">
                <div>
                    <p class="eyebrow">剑网 3 试炼之地</p>
                    <h1>试炼排行榜</h1>
                </div>
                <div class="filters">
                    <span class="filter">{{ (data && data.server) || server || '未知区服' }}</span>
                    <span class="filter kungfu">{{ (data && data.name) || name || '未知心法' }}</span>
                </div>
            </header>
            <template v-if="data && data.data && data.data.length">
                <div class="table-head">
                    <span>名次</span>
                    <span>角色</span>
                    <span>最高层数</span>
                    <span>装备分数</span>
                    <span>试炼总分</span>
                </div>
                <section>
                    <div class="row" v-for="(item, index) in data.data" :key="index">
                        <span class="rank">{{ index + 1 }}</span>
                        <strong class="role">{{ item['role_name'] || item.roleName || '未知角色' }}</strong>
                        <span class="level">{{ item['max_level'] == null ? (item.maxLevel == null ? '暂无' : item.maxLevel) : item['max_level'] }}</span>
                        <span class="number">{{ formatNumber(item['equip_score'] == null ? item.equipScore : item['equip_score']) }}</span>
                        <span class="score">{{ formatNumber(item['total_score'] == null ? item.totalScore : item['total_score']) }}</span>
                    </div>
                </section>
            </template>
            <div class="empty" v-else>暂无试炼排行数据</div>
            <footer class="footer">
                <span>{{ time ? '更新时间：' + time : '试炼之地排行' }}</span>
                <span>数据来源：www.jx3api.com</span>
            </footer>
        </article>
    </main>
    <script>
        function formatTrialNumber(value) {
            return value == null ? '暂无' : Number(value).toLocaleString('zh-CN');
        }
        window.__BOT_DATA__ = Object.assign({ formatNumber: formatTrialNumber }, window.__BOT_DATA__ || {});
    </script>
</body>
</html>
