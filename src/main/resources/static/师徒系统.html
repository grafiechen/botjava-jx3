<!DOCTYPE html>
<html lang="zh-cn">
<head>
    <meta charset="UTF-8">
    <meta content="width=device-width, initial-scale=1.0" name="viewport">
    <title>师徒系统</title>
    <style>
        * { box-sizing: border-box; }
        [v-cloak] { display: none; }
        body { margin: 0; min-width: 1080px; background: #edf1f2; color: #20272c; font-family: "Microsoft YaHei", "PingFang SC", sans-serif; letter-spacing: 0; }
        #main { min-height: 720px; padding: 38px 56px; }
        .board { width: 100%; max-width: 1168px; margin: 0 auto; overflow: hidden; background: #fff; border: 1px solid #cfd5d8; border-radius: 8px; box-shadow: 0 18px 42px rgba(31, 38, 43, .12); }
        .header { min-height: 138px; padding: 25px 34px; display: flex; align-items: flex-end; justify-content: space-between; gap: 28px; border-top: 8px solid #35636b; border-bottom: 1px solid #dce1e4; }
        .eyebrow { margin: 0 0 8px; color: #68747c; font-size: 17px; }
        h1 { margin: 0; font-size: 38px; line-height: 1.2; }
        .location { text-align: right; }
        .location strong { display: block; color: #35636b; font-size: 19px; overflow-wrap: anywhere; }
        .location span { display: block; margin-top: 5px; color: #748087; font-size: 13px; }
        .table-head, .row { display: grid; grid-template-columns: 58px 1.15fr .75fr .85fr 1.05fr 2.1fr; gap: 16px; align-items: center; }
        .table-head { min-height: 50px; padding: 0 30px; color: #68747c; background: #f4f6f7; border-bottom: 1px solid #dce1e4; font-size: 13px; font-weight: 700; }
        .row { min-height: 86px; padding: 12px 30px; border-bottom: 1px solid #e2e6e8; }
        .row:last-child { border-bottom: 0; }
        .index { color: #995c4b; font-size: 22px; font-weight: 800; }
        .role { color: #20272c; font-size: 17px; font-weight: 800; overflow-wrap: anywhere; }
        .sub { margin-top: 4px; color: #7a858c; font-size: 12px; overflow-wrap: anywhere; }
        .camp { color: #35636b; font-size: 15px; font-weight: 750; overflow-wrap: anywhere; }
        .guild { color: #4d5960; font-size: 14px; font-weight: 700; overflow-wrap: anywhere; }
        .comment { color: #5f514c; font-size: 14px; line-height: 1.55; overflow-wrap: anywhere; }
        .empty { min-height: 320px; display: flex; align-items: center; justify-content: center; color: #77838a; font-size: 22px; }
        .footer { padding: 16px 30px 19px; color: #7a858c; background: #fafbfb; border-top: 1px solid #dce1e4; font-size: 13px; }
    </style>
</head>
<body>
<main id="main" v-cloak>
    <article class="board">
        <header class="header">
            <div><p class="eyebrow">剑网 3 江湖师徒招募</p><h1>师徒系统</h1></div>
            <div class="location"><strong>{{ server || '服务器未知' }}</strong><span>{{ zone || '大区未知' }}</span></div>
        </header>
        <template v-if="data && data.length">
            <div class="table-head"><span>序号</span><span>角色</span><span>门派</span><span>阵营</span><span>帮会</span><span>招募说明</span></div>
            <section>
                <div class="row" v-for="(item, index) in data" :key="index">
                    <span class="index">{{ index + 1 }}</span>
                    <div><div class="role">{{ item.roleName || '角色未知' }}</div><div class="sub">{{ item.bodyName || '体型未知' }} · {{ item.roleLevel ? item.roleLevel + ' 级' : '等级未知' }}</div></div>
                    <span class="camp">{{ item.forceName || '门派未知' }}</span>
                    <span class="camp">{{ item.campName || '阵营未知' }}</span>
                    <div><div class="guild">{{ item.tongName || '暂无帮会' }}</div><div class="sub">帮主：{{ item.tongMasterName || '未知' }}</div></div>
                    <span class="comment">{{ item.comment || '暂无招募说明' }}</span>
                </div>
            </section>
        </template>
        <div class="empty" v-else>暂无师徒招募数据</div>
        <footer class="footer">共 {{ data && data.length ? data.length : 0 }} 条记录<span v-if="time"> · 更新时间 {{ time }}</span></footer>
    </article>
</main>
</body>
</html>
