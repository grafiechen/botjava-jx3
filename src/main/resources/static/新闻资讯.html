<!DOCTYPE html>
<html lang="zh-cn">
<head>
    <meta charset="UTF-8">
    <meta content="width=device-width, initial-scale=1.0" name="viewport">
    <title>新闻资讯</title>
    <style>
        * { box-sizing: border-box; }
        [v-cloak] { display: none; }
        body { margin: 0; min-width: 1080px; background: #e9edef; color: #20282d; font-family: "Microsoft YaHei", "PingFang SC", sans-serif; letter-spacing: 0; }
        #main { min-height: 720px; padding: 38px 56px; }
        .board { width: 100%; max-width: 1168px; margin: 0 auto; overflow: hidden; background: #fff; border: 1px solid #cbd3d7; border-radius: 8px; box-shadow: 0 18px 42px rgba(31, 42, 48, .12); }
        .header { min-height: 132px; padding: 24px 36px; display: flex; align-items: flex-end; justify-content: space-between; gap: 28px; border-top: 8px solid #596d76; border-bottom: 1px solid #dae1e4; }
        .eyebrow { margin: 0 0 7px; color: #717d82; font-size: 15px; }
        h1 { margin: 0; font-size: 36px; line-height: 1.2; }
        .count { color: #87594b; font-size: 18px; font-weight: 800; }
        .table-head, .row { display: grid; grid-template-columns: 78px 145px 1fr 100px; gap: 22px; align-items: center; }
        .table-head { min-height: 50px; padding: 0 36px; color: #6e7a80; background: #f2f5f6; border-bottom: 1px solid #dae1e4; font-size: 13px; font-weight: 700; }
        .row { min-height: 82px; padding: 14px 36px; border-bottom: 1px solid #e1e6e8; }
        .row:last-child { border-bottom: 0; }
        .index { color: #8b5948; font-size: 23px; font-weight: 800; }
        .type { color: #52676f; font-size: 14px; font-weight: 800; overflow-wrap: anywhere; }
        .title { color: #263138; font-size: 17px; font-weight: 800; line-height: 1.45; overflow-wrap: anywhere; }
        .date { color: #727f85; font-size: 14px; text-align: right; }
        .empty { min-height: 390px; display: flex; align-items: center; justify-content: center; color: #78848a; font-size: 22px; }
        .footer { padding: 15px 36px 18px; color: #7b878d; background: #fafbfb; font-size: 13px; }
    </style>
</head>
<body>
<main id="main" v-cloak>
    <article class="board">
        <header class="header"><div><p class="eyebrow">剑网 3 官方资讯</p><h1>{{ title || '新闻资讯' }}</h1></div><div class="count">近期 {{ data && data.length ? data.length : 0 }} 条</div></header>
        <template v-if="data && data.length"><div class="table-head"><span>序号</span><span>分类</span><span>标题</span><span>日期</span></div><section><div class="row" v-for="(item, index) in data" :key="index"><span class="index">{{ index + 1 }}</span><span class="type">{{ item.type || '官方资讯' }}</span><span class="title">{{ item.title || '标题未知' }}</span><span class="date">{{ item.date || '日期未知' }}</span></div></section></template>
        <div class="empty" v-else>暂无官方资讯</div>
        <footer class="footer">仅展示分类、标题与可读日期，不加载新闻外部链接</footer>
    </article>
</main>
</body>
</html>
