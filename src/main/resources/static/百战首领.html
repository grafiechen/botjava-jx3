<!DOCTYPE html>
<html lang="zh-cn">
<head>
    <meta charset="UTF-8">
    <meta content="width=device-width, initial-scale=1.0" name="viewport">
    <title>百战首领</title>
    <style>
        * { box-sizing: border-box; }
        [v-cloak] { display: none; }
        body {
            margin: 0;
            min-width: 1080px;
            background: #edf1f2;
            color: #20272c;
            font-family: "Microsoft YaHei", "PingFang SC", sans-serif;
            letter-spacing: 0;
        }
        #main { min-height: 720px; padding: 40px 60px; }
        .board {
            width: 100%;
            max-width: 1160px;
            margin: 0 auto;
            overflow: hidden;
            background: #ffffff;
            border: 1px solid #cfd5d8;
            border-radius: 8px;
            box-shadow: 0 18px 42px rgba(31, 38, 43, 0.12);
        }
        .header {
            min-height: 142px;
            padding: 25px 36px;
            display: flex;
            align-items: flex-end;
            justify-content: space-between;
            gap: 28px;
            border-top: 8px solid #765248;
            border-bottom: 1px solid #dce1e4;
        }
        .eyebrow { margin: 0 0 8px; color: #68747c; font-size: 17px; }
        h1 { margin: 0; color: #20262b; font-size: 38px; line-height: 1.2; }
        .summary { max-width: 430px; text-align: right; }
        .boss { color: #8b5648; font-size: 20px; font-weight: 800; }
        .period { margin-top: 7px; color: #68747c; font-size: 14px; line-height: 1.5; }
        .server { margin-top: 5px; color: #275e65; font-size: 14px; font-weight: 700; }
        .table-head, .row {
            display: grid;
            grid-template-columns: 70px 1fr 2fr 1.45fr;
            column-gap: 22px;
            align-items: center;
        }
        .table-head {
            min-height: 50px;
            padding: 0 32px;
            color: #65727a;
            background: #f4f6f7;
            border-bottom: 1px solid #dce1e4;
            font-size: 14px;
            font-weight: 700;
        }
        .row {
            min-height: 108px;
            padding: 14px 32px;
            border-bottom: 1px solid #e0e4e6;
        }
        .row:last-child { border-bottom: 0; }
        .index { color: #945649; font-size: 24px; font-weight: 800; }
        .name { color: #275e65; font-size: 19px; font-weight: 800; overflow-wrap: anywhere; }
        .tags { display: flex; flex-wrap: wrap; gap: 6px; min-width: 0; }
        .tag {
            padding: 5px 8px;
            color: #4f5d64;
            background: #edf1f2;
            border-radius: 4px;
            font-size: 13px;
            font-weight: 650;
            overflow-wrap: anywhere;
        }
        .extra-name { color: #20272c; font-size: 15px; font-weight: 750; }
        .description { margin-top: 6px; color: #6d797f; font-size: 13px; line-height: 1.45; overflow-wrap: anywhere; }
        .effects { margin-top: 7px; color: #8b5648; font-size: 13px; line-height: 1.45; overflow-wrap: anywhere; }
        .empty {
            min-height: 300px;
            display: flex;
            align-items: center;
            justify-content: center;
            color: #77838a;
            font-size: 22px;
        }
        .footer {
            padding: 17px 32px 20px;
            color: #7a858c;
            background: #fafbfb;
            border-top: 1px solid #dce1e4;
            font-size: 14px;
        }
    </style>
</head>
<body>
    <main id="main" v-cloak>
        <article class="board">
            <header class="header">
                <div>
                    <p class="eyebrow">剑网 3 百战异闻录</p>
                    <h1>百战首领</h1>
                </div>
                <div class="summary">
                    <div class="boss">本周目标：{{ boss || '未知' }}</div>
                    <div class="period">第 {{ week || '未知' }} 周 · {{ start || '开始时间未知' }} 至 {{ end || '结束时间未知' }}</div>
                    <div class="server">{{ server || '服务器未知' }}</div>
                </div>
            </header>
            <template v-if="data && data.length">
                <div class="table-head">
                    <span>序号</span>
                    <span>首领</span>
                    <span>技能</span>
                    <span>附加机制</span>
                </div>
                <section>
                    <div class="row" v-for="(item, index) in data" :key="index">
                        <span class="index">{{ item.index || index + 1 }}</span>
                        <span class="name">{{ item.name || '首领未知' }}</span>
                        <div class="tags" v-if="item.skills && item.skills.length">
                            <span class="tag" v-for="(skill, skillIndex) in item.skills" :key="skillIndex">{{ skill }}</span>
                        </div>
                        <span class="description" v-else>暂无技能信息</span>
                        <div>
                            <div class="extra-name" v-if="item.extraName && item.extraName !== '无'">{{ item.extraName }}</div>
                            <div class="description" v-if="item.description && item.description !== '无'">{{ item.description }}</div>
                            <div class="effects" v-if="item.effects && item.effects.length">{{ item.effects.join('、') }}</div>
                            <div class="description" v-if="(!item.extraName || item.extraName === '无') && (!item.description || item.description === '无') && (!item.effects || !item.effects.length)">无附加机制</div>
                        </div>
                    </div>
                </section>
            </template>
            <div class="empty" v-else>暂无百战首领数据</div>
            <footer class="footer">共 {{ data && data.length ? data.length : 0 }} 位首领 · 时间按北京时间展示</footer>
        </article>
    </main>
</body>
</html>
