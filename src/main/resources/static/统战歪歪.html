<!DOCTYPE html>
<html lang="zh-cn">
<head>
    <meta charset="UTF-8">
    <meta content="width=device-width, initial-scale=1.0" name="viewport">
    <title>统战歪歪</title>
    <style>
        * { box-sizing: border-box; }
        [v-cloak] { display: none; }
        body { margin: 0; min-width: 1080px; background: #edf0f1; color: #20282d; font-family: "Microsoft YaHei", "PingFang SC", sans-serif; letter-spacing: 0; }
        #main { min-height: 720px; padding: 38px 54px; }
        .board { width: 100%; max-width: 1172px; margin: 0 auto; overflow: hidden; background: #fff; border: 1px solid #cbd3d6; border-radius: 8px; box-shadow: 0 18px 42px rgba(31, 42, 47, .12); }
        .header { min-height: 136px; padding: 25px 36px; display: flex; align-items: flex-end; justify-content: space-between; gap: 28px; border-top: 8px solid #5b6679; border-bottom: 1px solid #dae1e4; }
        .eyebrow { margin: 0 0 8px; color: #717d83; font-size: 15px; }
        h1 { margin: 0; font-size: 37px; line-height: 1.2; }
        .query { color: #8b5b42; font-size: 18px; font-weight: 800; overflow-wrap: anywhere; }
        .groups { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); }
        .group { min-width: 0; border-right: 1px solid #dfe5e7; border-bottom: 1px solid #dfe5e7; }
        .group:nth-child(even) { border-right: 0; }
        .group-title { margin: 0; padding: 15px 24px; color: #335f68; background: #f2f5f6; font-size: 18px; overflow-wrap: anywhere; }
        .channel { min-height: 76px; padding: 13px 24px; display: grid; grid-template-columns: minmax(180px, 1fr) 110px 96px; gap: 14px; align-items: center; border-top: 1px solid #e4e8ea; }
        .channel strong { display: block; font-size: 16px; overflow-wrap: anywhere; }
        .channel small { color: #7a858b; font-size: 13px; overflow-wrap: anywhere; }
        .users { color: #8b5b42; font-size: 17px; font-weight: 800; }
        .limit { color: #657279; font-size: 14px; text-align: right; }
        .empty { min-height: 350px; display: flex; align-items: center; justify-content: center; color: #78848a; font-size: 21px; }
        .footer { padding: 16px 34px 19px; color: #79858b; background: #fafbfb; border-top: 1px solid #dce2e4; font-size: 13px; }
    </style>
</head>
<body>
<main id="main" v-cloak>
    <article class="board">
        <header class="header"><div><p class="eyebrow">剑网 3 阵营频道状态</p><h1>统战歪歪</h1></div><div class="query">{{ server || '全区服' }}</div></header>
        <section class="groups" v-if="data && data.length"><article class="group" v-for="(group,index) in data" :key="index"><h2 class="group-title">{{ group.server || server || '未知服务器' }}</h2><div class="channel" v-for="(item,itemIndex) in group.channels" :key="itemIndex"><div><strong>{{ item.name || '频道名称未知' }}</strong><small>{{ item.campName || '阵营未知' }}</small></div><span class="users">{{ item.users == null ? '-' : item.users }} 人</span><span class="limit">上限 {{ item.limit == null ? '-' : item.limit }}</span></div><div class="channel" v-if="!group.channels || !group.channels.length"><small>暂无频道记录</small></div></article></section>
        <div class="empty" v-else>暂无统战频道记录</div>
        <footer class="footer">只展示频道名称、阵营与人数，不加载频道 logo 或内部 ID</footer>
    </article>
</main>
</body>
</html>
