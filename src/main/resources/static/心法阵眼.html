<!DOCTYPE html>
<html lang="zh-cn">
<head>
    <meta charset="UTF-8">
    <meta content="width=device-width, initial-scale=1.0" name="viewport">
    <title>心法阵眼</title>
    <style>
        * { box-sizing: border-box; }
        [v-cloak] { display: none; }
        body {
            margin: 0;
            min-width: 1080px;
            background: #edf1f2;
            color: #20272c;
            font-family: "Microsoft YaHei", "PingFang SC", sans-serif;
            letter-spacing: 0;
        }
        #main { min-height: 720px; padding: 40px 60px; }
        .board {
            width: 100%;
            max-width: 1160px;
            margin: 0 auto;
            overflow: hidden;
            background: #ffffff;
            border: 1px solid #cfd5d8;
            border-radius: 8px;
            box-shadow: 0 18px 42px rgba(31, 38, 43, 0.12);
        }
        .header {
            min-height: 150px;
            padding: 27px 36px;
            display: flex;
            align-items: flex-end;
            justify-content: space-between;
            gap: 30px;
            border-top: 8px solid #765248;
            border-bottom: 1px solid #dce1e4;
        }
        .eyebrow { margin: 0 0 8px; color: #68747c; font-size: 17px; }
        h1 { margin: 0; color: #20262b; font-size: 38px; line-height: 1.2; overflow-wrap: anywhere; }
        .matrix-name { max-width: 440px; color: #8b5648; font-size: 24px; font-weight: 800; text-align: right; overflow-wrap: anywhere; }
        .matrix-label { margin-top: 6px; color: #68747c; font-size: 13px; text-align: right; }
        .effects { padding: 22px 32px 28px; }
        .effect {
            display: grid;
            grid-template-columns: 72px 180px minmax(0, 1fr);
            gap: 18px;
            align-items: center;
            min-height: 74px;
            padding: 12px 14px;
            border-bottom: 1px solid #e0e4e6;
        }
        .effect:last-child { border-bottom: 0; }
        .level {
            width: 54px;
            height: 42px;
            display: flex;
            align-items: center;
            justify-content: center;
            color: #ffffff;
            background: #275e65;
            border-radius: 4px;
            font-size: 18px;
            font-weight: 800;
        }
        .effect-name { color: #293238; font-size: 17px; font-weight: 800; overflow-wrap: anywhere; }
        .description { color: #5d6970; font-size: 14px; line-height: 1.65; overflow-wrap: anywhere; }
        .empty {
            min-height: 350px;
            display: flex;
            align-items: center;
            justify-content: center;
            color: #77838a;
            font-size: 22px;
        }
        .footer {
            padding: 16px 32px 19px;
            color: #7a858c;
            background: #fafbfb;
            border-top: 1px solid #dce1e4;
            font-size: 13px;
        }
    </style>
</head>
<body>
    <main id="main" v-cloak>
        <article class="board">
            <header class="header">
                <div>
                    <p class="eyebrow">剑网 3 心法阵法</p>
                    <h1>{{ name || '心法未知' }}</h1>
                </div>
                <div>
                    <div class="matrix-name">{{ skillName || '阵眼名称未知' }}</div>
                    <div class="matrix-label">阵眼技能</div>
                </div>
            </header>
            <section class="effects" v-if="effects && effects.length">
                <div class="effect" v-for="(effect, index) in effects" :key="index">
                    <span class="level">{{ effect.level || index + 1 }} 重</span>
                    <span class="effect-name">{{ effect.name || '效果名称未知' }}</span>
                    <span class="description">{{ effect.description || '暂无效果说明' }}</span>
                </div>
            </section>
            <div class="empty" v-else>暂无阵眼效果数据</div>
            <footer class="footer">共 {{ effects && effects.length ? effects.length : 0 }} 重阵眼效果</footer>
        </article>
    </main>
</body>
</html>
