<!DOCTYPE html>
<html lang="zh-cn">
<head>
    <meta charset="UTF-8">
    <meta content="width=device-width, initial-scale=1.0" name="viewport">
    <title>关隘首领</title>
    <style>
        * { box-sizing: border-box; }
        [v-cloak] { display: none; }
        body {
            margin: 0;
            min-width: 1080px;
            background: #edf1f2;
            color: #20272c;
            font-family: "Microsoft YaHei", "PingFang SC", sans-serif;
            letter-spacing: 0;
        }
        #main { min-height: 720px; padding: 46px 60px; }
        .board {
            width: 100%;
            max-width: 1160px;
            margin: 0 auto;
            overflow: hidden;
            background: #ffffff;
            border: 1px solid #cfd5d8;
            border-radius: 8px;
            box-shadow: 0 18px 42px rgba(31, 38, 43, 0.12);
        }
        .header {
            min-height: 148px;
            padding: 28px 36px;
            display: flex;
            align-items: flex-end;
            justify-content: space-between;
            gap: 28px;
            border-top: 8px solid #476a78;
            border-bottom: 1px solid #dce1e4;
        }
        .eyebrow { margin: 0 0 8px; color: #68747c; font-size: 17px; }
        h1 { margin: 0; color: #20262b; font-size: 38px; line-height: 1.2; }
        .scope {
            padding: 9px 15px;
            color: #ffffff;
            background: #8b5648;
            border-radius: 4px;
            font-size: 18px;
            font-weight: 750;
        }
        .table-head, .row {
            display: grid;
            grid-template-columns: 70px 1.1fr 1.25fr 1fr 1.25fr 130px;
            column-gap: 18px;
            align-items: center;
        }
        .table-head {
            min-height: 54px;
            padding: 0 36px;
            color: #65727a;
            background: #f4f6f7;
            border-bottom: 1px solid #dce1e4;
            font-size: 14px;
            font-weight: 700;
        }
        .row {
            min-height: 82px;
            padding: 13px 36px;
            border-bottom: 1px solid #e0e4e6;
        }
        .row:last-child { border-bottom: 0; }
        .index { color: #8b5648; font-size: 25px; font-weight: 800; }
        .primary { color: #20272c; font-size: 18px; font-weight: 750; overflow-wrap: anywhere; }
        .secondary { margin-top: 5px; color: #748087; font-size: 14px; overflow-wrap: anywhere; }
        .camp { color: #245f66; font-size: 17px; font-weight: 750; overflow-wrap: anywhere; }
        .status {
            min-width: 92px;
            padding: 7px 10px;
            justify-self: start;
            text-align: center;
            border-radius: 4px;
            background: #e8edef;
            color: #58656c;
            font-size: 15px;
            font-weight: 750;
        }
        .status.protected { background: #e7eef4; color: #355f78; }
        .status.active { background: #f6eadc; color: #8a541f; }
        .empty {
            min-height: 300px;
            display: flex;
            align-items: center;
            justify-content: center;
            color: #77838a;
            font-size: 22px;
        }
        .footer {
            padding: 19px 36px 21px;
            color: #7a858c;
            background: #fafbfb;
            border-top: 1px solid #dce1e4;
            font-size: 14px;
        }
    </style>
</head>
<body>
    <main id="main" v-cloak>
        <article class="board">
            <header class="header">
                <div>
                    <p class="eyebrow">剑网 3 跨服关隘状态</p>
                    <h1>关隘首领</h1>
                </div>
                <div class="scope">{{ server || '全服' }}</div>
            </header>
            <template v-if="data && data.length">
                <div class="table-head">
                    <span>序号</span>
                    <span>关隘</span>
                    <span>首领</span>
                    <span>阵营</span>
                    <span>区服</span>
                    <span>状态</span>
                </div>
                <section>
                    <div class="row" v-for="(item, index) in data" :key="index">
                        <span class="index">{{ index + 1 }}</span>
                        <span class="primary">{{ item.castle || '未知关隘' }}</span>
                        <span class="primary">{{ item.leader || '首领未知' }}</span>
                        <span class="camp">{{ item.campName || '阵营未知' }}</span>
                        <div>
                            <div class="primary">{{ item.server || '服务器未知' }}</div>
                            <div class="secondary">{{ item.zone || '大区未知' }}</div>
                        </div>
                        <span class="status" :class="{
                            protected: item.statusText && item.statusText.indexOf('保护') >= 0,
                            active: item.statusText && (item.statusText.indexOf('争夺') >= 0 || item.statusText.indexOf('可用') >= 0)
                        }">{{ item.statusText || '状态未知' }}</span>
                    </div>
                </section>
            </template>
            <div class="empty" v-else>暂无关隘首领记录</div>
            <footer class="footer">共 {{ data && data.length ? data.length : 0 }} 条记录</footer>
        </article>
    </main>
</body>
</html>
