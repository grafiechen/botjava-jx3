name: ci

on:
  push:
    branches: ["**"]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-22.04
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven

      - name: Verify UTF-8 text files
        shell: bash
        run: |
          find . -path './.git' -prune -o -path './target' -prune -o \
            -type f \( -name '*.java' -o -name '*.md' -o -name '*.html' -o \
            -name '*.json' -o -name '*.yml' -o -name '*.yaml' -o -name '*.sql' -o \
            -name '*.ps1' -o -name '*.xml' -o -name '*.properties' \) \
            -print0 | xargs -0 -r -n 1 iconv -f UTF-8 -t UTF-8 -o /dev/null

      - name: Verify whitespace
        shell: bash
        env:
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          PUSH_BEFORE_SHA: ${{ github.event.before }}
        run: |
          zero_sha=0000000000000000000000000000000000000000
          base_sha="$PR_BASE_SHA"
          if [ -z "$base_sha" ]; then
            base_sha="$PUSH_BEFORE_SHA"
          fi
          if [ -n "$base_sha" ] && [ "$base_sha" != "$zero_sha" ]; then
            git diff --check "$base_sha" HEAD
          else
            git diff-tree --check --no-commit-id -r HEAD
          fi

      - name: Install Chromium and system dependencies
        run: >-
          mvn -B -q exec:java
          -Dexec.mainClass=com.microsoft.playwright.CLI
          -Dexec.args="install --with-deps chromium"

      - name: Run tests
        run: mvn -B test
